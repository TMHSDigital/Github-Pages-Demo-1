name: CI

# Checks run on every push and pull request. On main, the deploy job then
# publishes the exact _site/ the checks tested, and only if they all passed.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
          cache: npm
      - name: Install pinned tooling
        run: npm ci
      - name: Calculator maths unit tests
        run: npm run test:unit
      - name: Calculator pages match the home page
        run: node scripts/sync-tool-pages.cjs --check
      - name: Validate HTML
        run: npm run validate
      - name: Lint JS
        run: npm run lint
      - name: Smoke, keyboard and accessibility tests (source)
        run: npm test
      - name: Stage the publishable site
        run: npm run build
      - name: Smoke, keyboard and accessibility tests (staged build)
        run: SITE_DIR=_site node tests/smoke.cjs
      - name: Check external links
        run: npm run links
      - name: Lighthouse budgets (every page in the sitemap)
        run: npm run lighthouse
      - name: Check internal links
        run: |
          python3 - <<'PY'
          import glob, re, os, sys
          missing = []
          for page in ['index.html', '404.html'] + sorted(glob.glob('tools/*/index.html')):
              for ref in re.findall(r'(?:href|src)="([^"#:?]+)"', open(page, encoding='utf-8').read()):
                  if ref.startswith('/') or ref == './':
                      continue
                  # 404.html resolves from the root through its <base>; other pages from their own folder
                  target = ref if page == '404.html' else os.path.join(os.path.dirname(page), ref)
                  if not os.path.exists(target):
                      missing.append((page, ref))
          print(missing)
          sys.exit(1 if missing else 0)
          PY
      - name: Upload the tested site for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: _site

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
